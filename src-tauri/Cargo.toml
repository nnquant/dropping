[package]
name = "dropping"
version = "0.1.1"
description = "A focused two-pane SFTP file transfer client"
authors = ["nnquant and Dropping contributors"]
license = "MIT"
repository = "https://github.com/nnquant/dropping"
homepage = "https://github.com/nnquant/dropping"
edition = "2021"
rust-version = "1.89"

[lib]
name = "dropping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
glob = "0.3"
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
